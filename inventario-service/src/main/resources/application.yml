spring:
  application:
    name: inventario-service

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=inventario_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: crpp
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always