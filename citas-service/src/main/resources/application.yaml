spring:
  application:
    name: citas-service

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=citas_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: ''
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8083

microservices:
  clientes:
    base-url: http://localhost:8082
  vehiculos:
    base-url: http://localhost:8082

  kafka:
    topics:
      cita-creada: cita-creada

  rabbitmq:
    queues:
      cita-registrada: cita.registrada
    exchanges:
      cita: cita.exchange
    bindings:
      cita-registrada: cita.registrada
