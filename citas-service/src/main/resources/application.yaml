spring:
  application:
    name: citas-service

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS01;databaseName=citas_db;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8083

microservices:
  clientes:
    base-url: http://localhost:8082
  vehiculos:
    base-url: http://localhost:8082

  kafka:
    topics:
      citas-events: citas-events

  rabbitmq:
    queues:
      cita-registrada: notificaciones.cita-registrada
    exchanges:
      notificaciones: notificaciones.exchange
    bindings:
      cita-registrada: cita.registrada
