server:
  port: 8084

spring:
  application:
    name: ordenes-service

  datasource:
    url: jdbc:sqlserver://localhost;databaseName=ordenesdb;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: "crpp"

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# para otros microservicios
services:
  vehiculos:
    url: http://localhost:8082
  clientes:
    url: http://localhost:8082
  usuarios:
    url: ${USUARIOS_URL:http://localhost:8081}
  inventario:
    url: ${INVENTARIO_URL:http://localhost:8085}

app:
  kafka:
    topic:
      ordenes: ordenes.eventos

logging:
  level:
    com.autoservice.ordenes: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace