server:
  port: 8084

spring:
  application:
    name: ordenes-service

  datasource:
    url: ${ORDENES_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=ordenesdb;encrypt=true;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# para otros microservicios
services:
  vehiculos:
    url: ${CLIENTES_VEHICULOS_SERVICE_URL:http://localhost:8082}
  clientes:
    url: ${CLIENTES_VEHICULOS_SERVICE_URL:http://localhost:8082}

logging:
  level:
    com.autoservice.ordenes: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
