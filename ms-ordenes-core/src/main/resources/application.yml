server:
  port: 8084

spring:
  application:
    name: ordenes-service

  datasource:
    url: jdbc:h2:mem:ordenes_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

services:
  vehiculos:
    url: http://localhost:8082

  clientes:
    url: http://localhost:8082

logging:
  level:
    com.autoservice.ordenes: debug
    org.hibernate.SQL: debug