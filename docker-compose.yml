services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "${SQLSERVER_HOST_PORT:-11433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - autoservice-net
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      SQLSERVER_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
    volumes:
      - ./docker/sqlserver-init.sh:/docker/sqlserver-init.sh:ro
    entrypoint: ["/bin/bash", "/docker/sqlserver-init.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - autoservice-net
    restart: "no"

  usuarios-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-autoservice}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-autoservice}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-AutoService2026!Mysql}
    volumes:
      - usuarios_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - autoservice-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - autoservice-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - autoservice-net
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "18090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: AutoService
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - autoservice-net
    restart: unless-stopped

  usuarios-service:
    build:
      context: ./usuarios-service
    ports:
      - "18091:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://usuarios-db:3306/usuarios_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-autoservice}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-autoservice}
      JWT_SECRET: ${JWT_SECRET:-AutoService2026SuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-1800}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RECEPCION_PASSWORD: ${RECEPCION_PASSWORD:-recepcion123}
      MECANICO_PASSWORD: ${MECANICO_PASSWORD:-mecanico123}
      FACTURACION_PASSWORD: ${FACTURACION_PASSWORD:-facturacion123}
    depends_on:
      usuarios-db:
        condition: service_healthy
    networks:
      - autoservice-net
    restart: unless-stopped

  clientes-vehiculos-service:
    build:
      context: ./ms-clientes-vehiculos
    ports:
      - "18082:8082"
    environment:
      CLIENTES_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=clientes_vehiculos_db;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - autoservice-net
    restart: unless-stopped

  citas-service:
    build:
      context: ./citas-service
    ports:
      - "18083:8083"
    environment:
      CITAS_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=citas_db;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLIENTES_VEHICULOS_SERVICE_URL: http://clientes-vehiculos-service:8082
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      clientes-vehiculos-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - autoservice-net
    restart: unless-stopped

  ms-ordenes-core:
    build:
      context: ./ms-ordenes-core
    ports:
      - "18084:8084"
    environment:
      ORDENES_DATASOURCE_URL: jdbc:h2:file:/app/data/ordenes_db;DB_CLOSE_ON_EXIT=FALSE
      DB_USERNAME: sa
      DB_PASSWORD: ""
      CLIENTES_VEHICULOS_SERVICE_URL: http://clientes-vehiculos-service:8082
      INVENTARIO_SERVICE_URL: http://inventario-service:8085
      USUARIOS_SERVICE_URL: http://usuarios-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      clientes-vehiculos-service:
        condition: service_started
      inventario-service:
        condition: service_started
      usuarios-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - autoservice-net
    volumes:
      - ordenes_core_data:/app/data
    restart: unless-stopped

  inventario-service:
    build:
      context: ./inventario-service
    ports:
      - "18085:8085"
    volumes:
      - inventario_data:/app/data
    environment:
      INVENTARIO_DATASOURCE_URL: jdbc:h2:file:/app/data/inventario_db;DB_CLOSE_ON_EXIT=FALSE
    networks:
      - autoservice-net
    restart: unless-stopped

  notificaciones-service:
    build:
      context: ./notificaciones-service
    ports:
      - "18087:8087"
    environment:
      NOTIFICACIONES_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=notificaciones_db;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - autoservice-net
    restart: unless-stopped

  historial-service:
    build:
      context: ./ms-historial-service
    ports:
      - "18088:8088"
    environment:
      HISTORIAL_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=historial_db;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-AutoService2026!Sql}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - autoservice-net
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway-service
    ports:
      - "18000:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-AutoService2026SuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!}
      USUARIOS_SERVICE_URL: http://usuarios-service:8081
      CLIENTES_VEHICULOS_SERVICE_URL: http://clientes-vehiculos-service:8082
      CITAS_SERVICE_URL: http://citas-service:8083
      ORDENES_SERVICE_URL: http://ms-ordenes-core:8084
      INVENTARIO_SERVICE_URL: http://inventario-service:8085
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8087
      HISTORIAL_SERVICE_URL: http://historial-service:8088
    depends_on:
      usuarios-service:
        condition: service_started
      clientes-vehiculos-service:
        condition: service_started
      citas-service:
        condition: service_started
      ms-ordenes-core:
        condition: service_started
      inventario-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      historial-service:
        condition: service_started
    networks:
      - autoservice-net
    restart: unless-stopped

volumes:
  sqlserver_data:
  usuarios_db_data:
  kafka_data:
  inventario_data:
  ordenes_core_data:

networks:
  autoservice-net:
    name: autoservice-net
