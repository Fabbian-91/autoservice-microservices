spring:
  application:
    name: ordenes-service

  datasource:
    url: jdbc:h2:file:./data/ordenes_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8084

services:
  usuarios:
    url: ${USUARIOS_URL:http://localhost:8081}

  inventario:
    url: ${INVENTARIO_URL:http://localhost:8085}

app:
  kafka:
    topic:
      ordenes: ordenes.eventos