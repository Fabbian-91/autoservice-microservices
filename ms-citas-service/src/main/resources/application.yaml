server:
  port: ${SERVER_PORT}

spring:
  config:
    import: optional:file:ms-citas-service/.env[.properties]

  application:
    name: citas-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

microservices:
  clientes:
    base-url: ${CLIENTES_VEHICULOS_SERVICE_URL}

  vehiculos:
    base-url: ${CLIENTES_VEHICULOS_SERVICE_URL}

  kafka:
    topics:
      citas-events: citas-events

  rabbitmq:
    queues:
      cita-registrada: notificaciones.cita-registrada

    exchanges:
      notificaciones: notificaciones.exchange

    bindings:
      cita-registrada: cita.registrada