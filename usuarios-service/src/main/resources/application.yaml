server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: usuarios-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}

app:
  seed:
    admin-password: ${ADMIN_PASSWORD}
    recepcion-password: ${RECEPCION_PASSWORD}
    mecanico-password: ${MECANICO_PASSWORD}
    facturacion-password: ${FACTURACION_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
